<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Card — teacher's remarks included</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Kalam:wght@400;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;
background-image:radial-gradient(circle at 50% -10%,#2a2115 0%,var(--dark) 60%);
display:flex;flex-direction:column;align-items:center;padding:24px 14px 50px}
a.back{align-self:flex-start;color:var(--haldi);font-size:13px;text-decoration:none;margin-bottom:8px}
.brand{background:var(--enamel);border:4px solid var(--haldi);border-radius:6px;padding:8px 26px;transform:rotate(-1deg);
box-shadow:5px 6px 0 rgba(0,0,0,.5);margin-bottom:4px}
.brand h1{font-family:'Yatra One',cursive;font-size:clamp(24px,5vw,38px);text-shadow:2px 2px 0 var(--red)}
.sub{color:#c9b790;font-size:12px;margin-bottom:18px;text-align:center}
#panel{width:min(600px,96vw);display:flex;flex-direction:column;gap:12px}
canvas{width:100%;border-radius:6px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select{flex:1;min-width:160px;font-family:'Karla';font-size:15px;font-weight:700;padding:10px 12px;border-radius:8px;
border:2px solid #3a2f1c;background:#241c10;color:var(--cream);outline:none}
input:focus{border-color:var(--haldi)}
button{font-family:'Karla';font-weight:700;font-size:15px;border:none;border-radius:10px;padding:13px 20px;cursor:pointer}
#genBtn{background:var(--enamel);color:var(--cream)}
#dlBtn{background:var(--red);color:var(--cream);flex:1}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
</style></head>
<body>
<a class="back" href="index.html">← nukkad</a>
<div class="brand"><h1>रिपोर्ट कार्ड</h1></div>
<p class="sub">REPORT CARD · sign karwa ke lana · remarks column dhyan se padhna</p>

<div id="panel">
  <canvas id="cv" width="1000" height="1300"></canvas>
  <div class="row">
    <input id="f_name" maxlength="16" value="Bunty" aria-label="Student name" placeholder="student ka naam">
    <select id="f_vibe" aria-label="Student type">
      <option value="0">backbencher (legend)</option>
      <option value="1">average (safe zone)</option>
      <option value="2">topper (Sharma ji ka beta)</option>
    </select>
  </div>
  <div class="row">
    <button id="genBtn">🎲 marks + remarks badlo</button>
    <button id="dlBtn">⬇️ PNG — parents ko MAT bhejna</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const SUBJECTS=['Hindi','English','Maths','Science','Social Studies','Drawing','P.T.'];
const REMARKS={
 0:['Talks in class. Talks in corridor. Talks in sleep (probably).','Can do better. Has been "can do better" since 2019.','Very active in class. Unfortunately not in studies.','Homework diary is a work of fiction.','His handwriting is a security feature — no one can copy it.','Excellent attendance... in the canteen.'],
 1:['Satisfactory. Like dal without tadka.','Neither trouble nor triumph. The invisible child.','Does homework. Sometimes even his own.','Average — but consistently. Respect the consistency.','Sits in middle row. Lives in middle row. Is middle row.'],
 2:['Excellent! (Other parents are asking for his tuition details.)','A pleasure to teach. A menace to classmates\' self-esteem.','Finishes exam early, then sharpens pencil LOUDLY.','Asks questions even teacher fears.','Sets the curve. Class has filed a complaint.']
};
const PT_REMARK=['Runs only when canteen opens.','Good at PT. PT = Permanent Timepass.','Shows great potential in gully cricket (not a subject).'];
function marks(vibe,subj){
  if(subj==='P.T.')return 45+Math.floor(Math.random()*50);
  if(vibe===0)return 33+Math.floor(Math.random()*30);
  if(vibe===1)return 55+Math.floor(Math.random()*25);
  return 88+Math.floor(Math.random()*12);
}
function draw(){
  const n=(document.getElementById('f_name').value||'Bunty').trim();
  const vibe=+document.getElementById('f_vibe').value;
  x.fillStyle='#f2ecd8';x.fillRect(0,0,1000,1300);
  x.strokeStyle='#12409e';x.lineWidth=8;x.strokeRect(30,30,940,1240);
  x.strokeStyle='#d5342b';x.lineWidth=2;x.strokeRect(46,46,908,1208);
  x.textAlign='center';
  x.font='44px "Yatra One"';x.fillStyle='#12409e';
  x.fillText('SARASWATI VIDYA MANDIR, NUKKAD',500,110);
  x.font='bold 20px Karla';x.fillStyle='#6b5b3a';
  x.fillText('PROGRESS REPORT · TERM II · "Vidya Hi Dhan Hai" (conditions apply)',500,146);
  x.font='bold 26px Karla';x.fillStyle='#17120c';x.textAlign='left';
  x.fillText('Naam: '+n,80,210);
  x.fillText('Class: 8-B (backbench '+(vibe===0?'confirmed':'nahi')+')',80,248);
  x.fillText('Roll No: '+(vibe===2?'1':(20+Math.floor(Math.random()*25))),620,210);
  /* table */
  const top=290,rowH=64;
  x.strokeStyle='#17120c';x.lineWidth=2;
  x.strokeRect(80,top,840,rowH*(SUBJECTS.length+1));
  x.font='bold 22px Karla';x.fillStyle='#12409e';
  x.fillText('VISHAY',100,top+40);x.fillText('MARKS /100',420,top+40);x.fillText('TEACHER KI NAZAR',600,top+40);
  x.beginPath();x.moveTo(80,top+rowH);x.lineTo(920,top+rowH);x.stroke();
  x.beginPath();x.moveTo(400,top);x.lineTo(400,top+rowH*(SUBJECTS.length+1));x.stroke();
  x.beginPath();x.moveTo(580,top);x.lineTo(580,top+rowH*(SUBJECTS.length+1));x.stroke();
  let total=0;
  SUBJECTS.forEach((s,i)=>{
    const y=top+rowH*(i+1);
    if(i)x.beginPath(),x.moveTo(80,y),x.lineTo(920,y),x.stroke();
    const m=marks(vibe,s);total+=m;
    x.font='22px Karla';x.fillStyle='#17120c';x.fillText(s,100,y+40);
    x.font='26px "Kalam"';x.fillStyle=m<40?'#c0392b':'#12409e';x.fillText(m,455,y+42);
    const looks=['😤','🙂','😮‍💨','🧐','😅'];
    x.font='24px Karla';x.fillText(looks[Math.floor(Math.random()*looks.length)],700,y+42);
  });
  const pct=(total/(SUBJECTS.length*100)*100).toFixed(1);
  x.font='bold 28px Karla';x.fillStyle='#17120c';
  x.fillText('TOTAL: '+total+'/700  ·  '+pct+'%',80,top+rowH*(SUBJECTS.length+1)+58);
  x.font='bold 24px Karla';x.fillStyle=pct>=75?'#1b7a3d':pct>=50?'#c8952f':'#c0392b';
  x.fillText('RESULT: '+(pct>=33?'PASS':'...garmi ki chhutti cancel')+(pct>=90?' (DISTINCTION!)':''),560,top+rowH*(SUBJECTS.length+1)+58);
  /* remarks */
  x.font='bold 24px Karla';x.fillStyle='#12409e';
  x.fillText('CLASS TEACHER KE REMARKS:',80,930);
  const pool=[...REMARKS[vibe]].sort(()=>Math.random()-.5).slice(0,3);
  pool.push(PT_REMARK[Math.floor(Math.random()*PT_REMARK.length)]);
  x.font='26px "Kalam"';x.fillStyle='#1a3a8c';
  pool.forEach((r,i)=>x.fillText('• '+r,90,980+i*46));
  /* signatures */
  x.font='20px Karla';x.fillStyle='#17120c';
  x.fillText('Class Teacher: __________',80,1210);
  x.fillText('Principal: __________',420,1210);
  x.fillText('Parent: (yahan asli drama hoga)',700,1210);
  x.font='16px Karla';x.fillStyle='#8a7750';x.textAlign='center';
  x.fillText('nukkad school press · report card kho jana bhi ek option hai',500,1252);
}
['f_name','f_vibe'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('genBtn').addEventListener('click',draw);
document.getElementById('dlBtn').addEventListener('click',()=>{
  const a=document.createElement('a');a.download='report-card.png';a.href=cv.toDataURL('image/png');a.click();});
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('44px "Yatra One"'),document.fonts.load('26px "Kalam"')]).then(draw).catch(draw);
  setTimeout(draw,1200);}else draw();
</script>
</body></html>
