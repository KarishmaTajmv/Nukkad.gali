<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chai Pe Charcha — do uncle, ek topic</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;
background-image:radial-gradient(circle at 50% -10%,#2a2115 0%,var(--dark) 60%);
display:flex;flex-direction:column;align-items:center;padding:24px 14px 50px}
a.back{align-self:flex-start;color:var(--haldi);font-size:13px;text-decoration:none;margin-bottom:8px}
.brand{background:#6b4423;border:4px solid var(--haldi);border-radius:6px;padding:8px 26px;transform:rotate(-1deg);
box-shadow:5px 6px 0 rgba(0,0,0,.5);margin-bottom:4px}
.brand h1{font-family:'Yatra One',cursive;font-size:clamp(22px,4.6vw,36px);text-shadow:2px 2px 0 var(--red)}
.sub{color:#c9b790;font-size:12px;margin-bottom:18px;text-align:center}
#panel{width:min(560px,96vw);display:flex;flex-direction:column;gap:12px}
#inputRow{display:flex;gap:8px}
input{flex:1;font-family:'Karla';font-size:15px;font-weight:700;padding:12px 14px;border-radius:10px;
border:3px solid var(--haldi);background:#241c10;color:var(--cream);outline:none}
button{font-family:'Karla';font-weight:700;font-size:15px;background:var(--red);color:var(--cream);
border:none;border-radius:10px;padding:0 20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
#chat{background:#0f0c07;border:3px solid #3a2f1c;border-radius:12px;padding:14px;height:340px;overflow-y:auto;
display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;animation:pop .18s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.msg.g{background:#2c2113;border:1px solid #5a4a28;align-self:flex-start;border-bottom-left-radius:2px}
.msg.g::before{content:'Gupta ji 🥸 (sab pehle se jaanta hai)';display:block;font-size:10px;color:var(--haldi);margin-bottom:3px}
.msg.v{background:#1a2440;border:1px solid #2a3a6a;align-self:flex-end;border-bottom-right-radius:2px}
.msg.v::before{content:'Verma ji 🧐 (asehmat by default)';display:block;font-size:10px;color:#8fb0e8;margin-bottom:3px;text-align:right}
.msg.sys{background:none;border:1px dashed #5a4a28;align-self:center;color:#c9b790;font-size:12px;text-align:center}
</style></head>
<body>
<a class="back" href="nukkad.html">← nukkad</a>
<div class="brand"><h1>चाय पे चर्चा</h1></div>
<p class="sub">CHAI PE CHARCHA · Gupta ji vs Verma ji · topic aapka, gyaan unka, nateeja kabhi nahi</p>

<div id="panel">
  <div id="inputRow">
    <input id="topic" maxlength="50" placeholder="topic do... (e.g. 'AI', 'cricket', 'aaj kal ke bachche')" aria-label="Debate topic">
    <button id="goBtn">CHARCHA!</button>
  </div>
  <div id="chat" aria-live="polite"><div class="msg sys">bench pe do uncle baithe hain. chai aa chuki hai. topic ka intezaar hai.</div></div>
</div>

<script>
const G_OPEN=["Dekho {T} ka asli sach main batata hoon — 1987 mein hi sab clear ho gaya tha.","{T}? Arre yeh toh main tab se keh raha hoon jab tum log paida bhi nahi hue the.","Mere bhateeje ne {T} pe pura research kiya hai. WhatsApp pe aaya tha. Padh lo pehle."];
const V_COUNTER=["Galat. Bilkul galat. {T} ke baare mein aapko utna hi pata hai jitna mujhe French mein.","Gupta ji, chai peeyo. {T} pe bolne se pehle sochna zaroori hai. Aapne kabhi try kiya?","Yeh WhatsApp University ka gyaan apne paas rakho. {T} asli mein bilkul ulta hai."];
const G_MID=["Suno — {T} mein sabse badi problem yeh nayi generation hai. Likh ke le lo.","Humare zamane mein {T} jaisi cheez ki zaroorat hi nahi thi. Hum khud hi sab kar lete the.","Ek minute — pehle yeh batao, tumne kabhi {T} ko paas se dekha bhi hai? Maine dekha hai. Do baar."];
const V_MID=["Zamana zamana zamana — Gupta ji, aapke zamane mein toh bijli bhi mehmaan thi.","{T} pe expert banne se pehle apna scooter toh theek karwa lo jo 3 saal se khada hai.","Main maanta hoon aapki baat mein dum hai... hota. Agar sahi hoti."];
const G_HEAT=["Achha?! Toh 2011 wali baat yaad dilaun jab aap {T} ke bilkul khilaf the?! Poora mohalla gawah hai!","Meri baat kaat rahe ho? MERI? Jisne is bench pe 22 saal charcha ki hai?!","Chai thandi ho rahi hai par main peeche nahi hatunga. {T} pe main SAHI hoon."];
const V_HEAT=["2011?! Aap 2011 mein khud confused the ki confusion kya hoti hai!","Bench aapki nahi, MCD ki hai! Aur {T} pe aap phir bhi galat ho!","Thandi chai pee lo, garam dimaag se toh behtar hai."];
const PEACE=["(chai wale ne do aur cutting rakh di) — dono ek saath: 'pehle chai.' [CEASEFIRE 30 seconds]","(ek teesra uncle aaya) 'kya chal raha hai?' — dono ek saath: 'kuch nahi, tum batao.' [topic reset]","Gupta ji: 'khair, ek baat pe toh sehmat ho — aajkal chai pehle jaisi nahi rahi.' Verma ji: '...haan. yeh sach hai.' [historic agreement]"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let running=false;
function say(w,t){const c=document.getElementById('chat'),d=document.createElement('div');
d.className='msg '+w;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;}
async function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function debate(topic){
  running=true;
  const T=s=>s.replaceAll('{T}',topic);
  say('sys','topic mil gaya: "'+topic+'" — charcha shuru.');
  await wait(900); say('g',T(pick(G_OPEN)));
  await wait(1600); say('v',T(pick(V_COUNTER)));
  await wait(1600); say('g',T(pick(G_MID)));
  await wait(1600); say('v',T(pick(V_MID)));
  await wait(1700); say('g',T(pick(G_HEAT)));
  await wait(1700); say('v',T(pick(V_HEAT)));
  await wait(1800); say('sys',pick(PEACE));
  await wait(1200); say('sys','nateeja: koi nahi jeeta. koi kabhi nahi jeetta. kal phir yahi hoga. naya topic do?');
  running=false;
}
document.getElementById('goBtn').addEventListener('click',()=>{
  if(running)return;
  const t=document.getElementById('topic').value.trim();
  if(!t){say('sys','bina topic ke bhi ladd sakte hain, par maza topic mein hai.');return;}
  document.getElementById('topic').value='';
  debate(t);
});
document.getElementById('topic').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtn').click();});
</script>
</body></html>
