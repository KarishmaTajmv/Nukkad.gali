<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shagun — woh extra ₹1</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Kalam:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;
background-image:radial-gradient(circle at 50% -10%,#2a2115 0%,var(--dark) 60%);
display:flex;flex-direction:column;align-items:center;padding:24px 14px 50px}
a.back{align-self:flex-start;color:var(--haldi);font-size:13px;text-decoration:none;margin-bottom:8px}
.brand{background:var(--red);border:4px solid var(--haldi);border-radius:6px;padding:8px 26px;transform:rotate(-1deg);
box-shadow:5px 6px 0 rgba(0,0,0,.5);margin-bottom:4px}
.brand h1{font-family:'Yatra One',cursive;font-size:clamp(24px,5vw,38px);text-shadow:2px 2px 0 var(--enamel)}
.sub{color:#c9b790;font-size:12px;margin-bottom:18px;text-align:center}
#panel{width:min(560px,96vw);display:flex;flex-direction:column;gap:12px}
canvas{width:100%;border-radius:8px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select{flex:1;min-width:150px;font-family:'Karla';font-size:15px;font-weight:700;padding:10px 12px;border-radius:8px;
border:2px solid #3a2f1c;background:#241c10;color:var(--cream);outline:none}
input:focus{border-color:var(--haldi)}
button{font-family:'Karla';font-weight:700;font-size:15px;border:none;border-radius:10px;padding:13px 20px;cursor:pointer;background:var(--red);color:var(--cream)}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
#wisdom{background:#241c10;border:2px solid #3a2f1c;border-radius:10px;padding:12px 14px;font-size:13px;color:#c9b790;line-height:1.6}
#wisdom b{color:var(--haldi)}
</style></head>
<body>
<a class="back" href="nukkad.html">← nukkad</a>
<div class="brand"><h1>शगुन</h1></div>
<p class="sub">SHAGUN LIFAFA · ₹500 nahi, ₹501 · woh ₹1 hi toh sab kuch hai</p>

<div id="panel">
  <canvas id="cv" width="1000" height="640"></canvas>
  <div class="row">
    <input id="f_to" maxlength="18" value="Chintu & Pinky" aria-label="Recipient" placeholder="kisko dena hai">
    <input id="f_from" maxlength="18" value="Gupta parivaar" aria-label="From" placeholder="kiski taraf se">
  </div>
  <div class="row">
    <select id="f_rel" aria-label="Closeness level">
      <option value="101">door ke rishtedaar — ₹101</option>
      <option value="251">jaan-pehchaan — ₹251</option>
      <option value="501" selected>acche waale — ₹501</option>
      <option value="1101">khaas — ₹1101</option>
      <option value="2100">bahut khaas — ₹2100</option>
      <option value="5100">apna hi ghar samjho — ₹5100</option>
    </select>
    <button id="dlBtn">⬇️ LIFAFA PNG</button>
  </div>
  <div id="wisdom"></div>
</div>

<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const WISDOM={
 101:'<b>₹101 ka gyaan:</b> yeh "hum aaye the" ka receipt hai. rishta zinda hai, bas ventilator pe.',
 251:'<b>₹251 ka gyaan:</b> calculated warmth. na kam na zyada. CA level precision.',
 501:'<b>₹501 ka gyaan:</b> the gold standard. woh ₹1 shubh hai — zero pe rishta khatam hota hai, 1 se aage badhta hai. isliye kabhi round figure mat dena.',
 1101:'<b>₹1101 ka gyaan:</b> ab yeh statement hai. "hum serious log hain." photo mein aage khade hone ka adhikar included.',
 2100:'<b>₹2100 ka gyaan:</b> mama-chacha tier. iske baad khaana do baar khaane ka haq banta hai.',
 5100:'<b>₹5100 ka gyaan:</b> ya toh bahut pyaar hai, ya purana udhaar chuka rahe ho. dono hi shubh hai.'
};
function v(id){return document.getElementById(id).value;}
function draw(){
  const amt=+v('f_rel');
  /* red envelope */
  const g=x.createLinearGradient(0,0,1000,640);
  g.addColorStop(0,'#d5342b');g.addColorStop(1,'#a8231b');
  x.fillStyle=g;x.fillRect(0,0,1000,640);
  /* flap */
  x.fillStyle='#b82a20';x.beginPath();x.moveTo(0,0);x.lineTo(500,240);x.lineTo(1000,0);x.closePath();x.fill();
  x.strokeStyle='#f2b31c';x.lineWidth=4;x.beginPath();x.moveTo(0,0);x.lineTo(500,240);x.lineTo(1000,0);x.stroke();
  /* border */
  x.strokeStyle='#f2b31c';x.lineWidth=10;x.strokeRect(18,18,964,604);
  /* gold seal */
  x.fillStyle='#f2b31c';x.beginPath();x.arc(500,240,54,0,7);x.fill();
  x.fillStyle='#a8231b';x.font='44px Karla';x.textAlign='center';x.textBaseline='middle';
  x.fillText('🪔',500,240);
  /* text */
  x.textBaseline='alphabetic';
  x.font='40px "Yatra One"';x.fillStyle='#ffe9b0';
  x.fillText('|| शुभ शगुन ||',500,360);
  x.font='700 42px "Kalam"';x.fillStyle='#fff';
  x.fillText('Priya '+v('f_to'),500,430);
  x.font='700 80px "Yatra One"';x.fillStyle='#f2b31c';
  x.fillText('₹'+amt.toLocaleString('en-IN'),500,530);
  x.font='700 26px "Kalam"';x.fillStyle='#ffe9b0';
  x.fillText('— '+v('f_from')+' ki taraf se, sneh sahit',500,580);
  x.font='16px Karla';x.fillStyle='rgba(255,255,255,.6)';
  x.fillText('(ginne ki zaroorat nahi... par sab ginte hain) · nukkad shagun press',500,614);
  document.getElementById('wisdom').innerHTML=WISDOM[amt];
}
['f_to','f_from','f_rel'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('dlBtn').addEventListener('click',()=>{
  const a=document.createElement('a');a.download='shagun-'+v('f_rel')+'.png';a.href=cv.toDataURL('image/png');a.click();});
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('80px "Yatra One"'),document.fonts.load('700 42px "Kalam"')]).then(draw).catch(draw);
  setTimeout(draw,1200);}else draw();
</script>
</body></html>
