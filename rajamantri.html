<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raja Mantri — chor kaun?</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;
background-image:radial-gradient(circle at 50% -10%,#2a2115 0%,var(--dark) 60%);
display:flex;flex-direction:column;align-items:center;padding:24px 14px 50px;text-align:center}
a.back{align-self:flex-start;color:var(--haldi);font-size:13px;text-decoration:none;margin-bottom:8px}
.brand{background:#7a1428;border:4px solid var(--haldi);border-radius:6px;padding:8px 26px;transform:rotate(-1deg);
box-shadow:5px 6px 0 rgba(0,0,0,.5);margin-bottom:4px}
.brand h1{font-family:'Yatra One',cursive;font-size:clamp(22px,4.6vw,34px);text-shadow:2px 2px 0 var(--red)}
.sub{color:#c9b790;font-size:12px;margin-bottom:20px}
#myChit{background:#fdf6e3;color:#26364a;border-radius:8px;padding:14px 26px;font-family:'Yatra One';
font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:rotate(-1.5deg);margin-bottom:6px}
#myChit small{display:block;font-family:'Karla';font-size:11px;color:#8a7750}
#pts{font-size:12px;color:#8a7750;margin-bottom:18px}
#players{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.pl{background:#241c10;border:3px solid #3a2f1c;border-radius:12px;padding:14px 12px;width:120px;transition:transform .12s,border-color .12s}
.pl.pick{cursor:pointer}
.pl.pick:hover{transform:translateY(-4px);border-color:var(--haldi)}
.pl.pick:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
.pl .face{font-size:40px}.pl .nm{font-weight:700;font-size:14px;margin-top:4px}
.pl .role{font-size:12px;color:var(--haldi);min-height:18px;margin-top:4px;font-weight:700}
.pl .quote{font-size:11px;color:#8a7750;font-style:italic;min-height:30px;margin-top:4px}
#msg{min-height:44px;font-size:15px;color:#c9b790;max-width:440px;margin-bottom:10px}
button{font-family:'Yatra One';font-size:18px;background:var(--red);color:var(--cream);border:3px solid var(--haldi);
border-radius:10px;padding:11px 26px;cursor:pointer;box-shadow:4px 5px 0 rgba(0,0,0,.5)}
#board{margin-top:12px;font-size:12px;color:#8a7750}#board b{color:var(--haldi)}
</style></head>
<body>
<a class="back" href="index.html">← nukkad</a>
<div class="brand"><h1>राजा मंत्री चोर सिपाही</h1></div>
<p class="sub">RAJA MANTRI · chit utha · agar SIPAHI mile toh chor pakad · warna dua kar</p>

<div id="myChit">🤫<small>aapki chit</small></div>
<p id="pts">Raja 1000 · Mantri 800 · Sipahi 500 (agar chor pakda) · Chor 0</p>

<div id="players"></div>
<p id="msg">chit uthane ke liye niche button dabao</p>
<button id="playBtn">🎲 chit batto</button>
<p id="board">aap: <b id="you">0</b> · Pappu: <b id="p0">0</b> · Golu: <b id="p1">0</b> · Sweety: <b id="p2">0</b></p>

<script>
const AI=[{n:'Pappu',f:'🧑🏽'},{n:'Golu',f:'👦🏽'},{n:'Sweety',f:'👧🏽'}];
const ROLES=['RAJA 👑','MANTRI 📜','SIPAHI 🗡️','CHOR 🦹'];
const PTS=[1000,800,500,0];
const INNOCENT=['maine kuch nahi kiya!! sach mein!!','main toh mandir se aa raha tha','mera chehra dekho — chor jaisa hai kya? (hai)','pehle Pappu se poochho','main chor hota toh batata nahi kya? ...ruk'];
let scores=[0,0,0,0],roles=null,myRole=null,phase='idle';
function say(t){document.getElementById('msg').textContent=t;}
function render(clickable){
  const box=document.getElementById('players');
  box.innerHTML=AI.map((a,i)=>`<div class="pl ${clickable?'pick':''}" ${clickable?'tabindex="0" role="button"':''} data-i="${i}">
    <div class="face">${a.f}</div><div class="nm">${a.n}</div>
    <div class="role" id="r${i}"></div><div class="quote" id="q${i}"></div></div>`).join('');
  if(clickable)document.querySelectorAll('.pl.pick').forEach(el=>{
    const go=()=>guess(+el.dataset.i);
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}
function deal(){
  roles=[0,1,2,3].sort(()=>Math.random()-.5); /* roles[0]=you, 1..3 = AI */
  myRole=roles[0];
  document.getElementById('myChit').innerHTML=ROLES[myRole]+'<small>aapki chit (kisi ko mat dikhana)</small>';
  render(false);
  if(myRole===2){ /* you are sipahi: interrogate & guess */
    phase='guess';
    say('AAP SIPAHI HO 🗡️ — teeno ko suno, phir CHOR pe click karo. sahi pakda = 500. galat = chor ko 500!');
    AI.forEach((a,i)=>{
      setTimeout(()=>{
        const q=document.getElementById('q'+i);
        const isChor=roles[i+1]===3;
        /* chor lies slightly more nervously */
        q.textContent='"'+INNOCENT[Math.floor(Math.random()*INNOCENT.length)]+(isChor&&Math.random()<.35?' 😅':'')+'"';
      },400+i*700);
    });
    setTimeout(()=>render(true)||AI.forEach((a,i)=>{
      document.getElementById('q'+i).textContent='"'+INNOCENT[Math.floor(Math.random()*INNOCENT.length)]+'"';}),2600);
  }else{
    /* AI sipahi guesses */
    const sipIdx=roles.indexOf(2); /* position in [you,ai0,ai1,ai2] */
    phase='watch';
    say(ROLES[myRole].split(' ')[0]+' mile ho aap. ab '+(sipIdx===0?'':' '+AI[sipIdx-1].n)+' (sipahi) chor dhoondhega...');
    setTimeout(()=>{
      /* AI guesses among the other three (70% wrong-ish randomness) */
      const suspects=[0,1,2,3].filter(i=>i!==sipIdx);
      const chorPos=roles.indexOf(3);
      const pick=Math.random()<.4?chorPos:suspects[Math.floor(Math.random()*suspects.length)];
      const pickedName=pick===0?'AAP':AI[pick-1].n;
      const correct=pick===chorPos;
      resolve(sipIdx,chorPos,correct,pickedName);
    },2200);
  }
}
function guess(aiIdx){
  if(phase!=='guess')return;phase='done';
  const chorPos=roles.indexOf(3);
  resolve(0,chorPos,(aiIdx+1)===chorPos,AI[aiIdx].n);
}
function resolve(sipPos,chorPos,correct,pickedName){
  /* reveal roles */
  AI.forEach((a,i)=>document.getElementById('r'+i).textContent=ROLES[roles[i+1]]);
  /* scoring */
  [0,1,2,3].forEach(pos=>{
    const role=roles[pos];
    if(role===2)scores[pos]+=correct?500:0;
    else if(role===3)scores[pos]+=correct?0:500;
    else scores[pos]+=PTS[role];
  });
  const chorName=chorPos===0?'AAP':AI[chorPos-1].n;
  say(correct?`SIPAHI ne ${pickedName} ko pakda — SAHI! chor ${chorName} tha. nyay hua. ⚖️`
    :`SIPAHI ne ${pickedName} pe shak kiya — GALAT! asli chor ${chorName} tha, 500 leke has raha hai. 🦹`);
  ['you','p0','p1','p2'].forEach((id,i)=>document.getElementById(id).textContent=scores[i]);
  phase='idle';
  document.getElementById('playBtn').textContent='🎲 phir batto';
}
document.getElementById('playBtn').addEventListener('click',()=>{if(phase==='idle')deal();});
render(false);
</script>
</body></html>
