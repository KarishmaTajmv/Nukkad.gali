<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaadi ka Card — with family, warna...</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Kalam:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c;--maroon:#7a1428}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Karla',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;
    background-image:radial-gradient(circle at 50% -10%,#2a2115 0%,var(--dark) 60%);
    display:flex;flex-direction:column;align-items:center;padding:26px 14px 60px}
  a.back{align-self:flex-start;color:var(--haldi);font-size:13px;text-decoration:none;margin-bottom:8px}
  .brand{background:var(--maroon);border:4px solid var(--haldi);border-radius:6px;padding:8px 26px;transform:rotate(-1deg);
    box-shadow:5px 6px 0 rgba(0,0,0,.5);margin-bottom:4px}
  .brand h1{font-family:'Yatra One',cursive;font-size:clamp(26px,5vw,40px);text-shadow:2px 2px 0 var(--red)}
  .sub{color:#c9b790;font-size:12px;margin-bottom:20px;text-align:center}
  #panel{width:min(600px,96vw);display:flex;flex-direction:column;gap:12px}
  canvas{width:100%;border-radius:8px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a7750;margin-bottom:4px}
  input{width:100%;font-family:'Karla';font-size:15px;font-weight:700;padding:10px 12px;border-radius:8px;
    border:2px solid #3a2f1c;background:#241c10;color:var(--cream);outline:none}
  input:focus{border-color:var(--haldi)}
  button{font-family:'Karla';font-weight:700;font-size:15px;border:none;border-radius:10px;padding:13px 20px;cursor:pointer;background:var(--red);color:var(--cream)}
  button:hover{transform:translateY(-2px)}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="nukkad.html">← nukkad</a>
<div class="brand"><h1>शादी का कार्ड</h1></div>
<p class="sub">SHAADI KA CARD · gold foil (digital) · "with family" COMPULSORY hai</p>

<div id="panel">
  <canvas id="cv" width="1000" height="1400"></canvas>
  <div class="grid">
    <div class="field"><label>dulha</label><input id="f_groom" maxlength="14" value="Chintu"></div>
    <div class="field"><label>dulhan</label><input id="f_bride" maxlength="14" value="Pinky"></div>
    <div class="field"><label>date</label><input id="f_date" maxlength="24" value="14 February 2027"></div>
    <div class="field"><label>venue</label><input id="f_venue" maxlength="30" value="Sapna Garden, bypass ke paas"></div>
    <div class="field"><label>invite kisko karna hai</label><input id="f_guest" maxlength="18" value="Sharma ji"></div>
    <div class="field"><label>kiske taraf se</label><input id="f_host" maxlength="20" value="Gupta parivaar"></div>
  </div>
  <button id="dlBtn">⬇️ CARD DOWNLOAD — guest ko bhejo (with family)</button>
</div>

<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');
function v(id){return document.getElementById(id).value||'—';}
function paisley(cx,cy,s,rot){
  x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);
  x.beginPath();x.moveTo(0,-20);x.bezierCurveTo(18,-20,18,10,0,20);x.bezierCurveTo(-10,14,-10,-8,0,-20);
  x.strokeStyle='#c8952f';x.lineWidth=2.5/s;x.stroke();
  x.beginPath();x.arc(0,0,6,0,7);x.stroke();x.restore();
}
function draw(){
  /* maroon base + border */
  x.fillStyle='#7a1428';x.fillRect(0,0,1000,1400);
  const grd=x.createLinearGradient(0,0,1000,1400);
  grd.addColorStop(0,'#8a1c30');grd.addColorStop(.5,'#7a1428');grd.addColorStop(1,'#5e0e1e');
  x.fillStyle=grd;x.fillRect(0,0,1000,1400);
  x.strokeStyle='#c8952f';x.lineWidth=10;x.strokeRect(36,36,928,1328);
  x.lineWidth=3;x.strokeRect(58,58,884,1284);
  /* corner paisleys */
  paisley(110,120,1.6,.5);paisley(890,120,1.6,-.5);
  paisley(110,1280,1.6,2.6);paisley(890,1280,1.6,-2.6);
  x.textAlign='center';
  /* ganesh-symbol substitute: shubh kalash */
  x.font='64px Karla';x.fillText('🪔',500,150);
  x.font='30px "Yatra One"';x.fillStyle='#f2b31c';
  x.fillText('|| शुभ विवाह ||',500,210);
  x.font='22px Karla';x.fillStyle='#e8c98a';
  x.fillText(v('f_host')+' sabhar nivedan karta hai',500,260);
  /* names */
  x.font='96px "Yatra One"';x.fillStyle='#f6ead3';
  x.fillText(v('f_groom'),500,400);
  x.font='52px "Kalam"';x.fillStyle='#f2b31c';
  x.fillText('💛 sang 💛',500,470);
  x.font='96px "Yatra One"';x.fillStyle='#f6ead3';
  x.fillText(v('f_bride'),500,590);
  /* divider */
  x.strokeStyle='#c8952f';x.lineWidth=2;
  x.beginPath();x.moveTo(220,650);x.lineTo(780,650);x.stroke();
  x.font='40px Karla';x.fillText('✦',500,662);
  /* details */
  x.font='30px Karla';x.fillStyle='#f6ead3';
  x.fillText('📅  '+v('f_date'),500,740);
  x.fillText('📍  '+v('f_venue'),500,795);
  /* functions */
  x.font='bold 22px Karla';x.fillStyle='#f2b31c';
  x.fillText('— KARYAKRAM —',500,880);
  x.font='24px Karla';x.fillStyle='#e8c98a';
  x.fillText('Haldi: subah se (jab tak haldi khatam na ho)',500,925);
  x.fillText('Sangeet: shaam 7 baje (naach compulsory)',500,965);
  x.fillText('Baraat: raat 9 baje (pahunchegi 11:30)',500,1005);
  x.fillText('Phere: shubh muhurat (yaani 2:45 AM)',500,1045);
  /* the guest line + the dhamki */
  x.font='34px "Kalam"';x.fillStyle='#fff';
  x.fillText('Adarniya '+v('f_guest')+' — WITH FAMILY',500,1140);
  x.font='bold 28px Karla';x.fillStyle='#f2b31c';
  x.fillText('aana ZAROOR hai',500,1195);
  x.font='20px Karla';x.fillStyle='#e8c98a';
  x.fillText('(nahi aaye toh hamesha yaad rakha jayega. shaadi bhool jaate hain, gair-haaziri nahi.)',500,1230);
  x.font='18px Karla';x.fillStyle='#c8952f';
  x.fillText('RSVP: koi nahi karta, seedha aa jana · gift: aapka aashirwad (aur lifafa)',500,1300);
  x.fillText('nukkad shaadi press',500,1336);
}
['f_groom','f_bride','f_date','f_venue','f_guest','f_host'].forEach(id=>
  document.getElementById(id).addEventListener('input',draw));
document.getElementById('dlBtn').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='shaadi-card-'+v('f_groom')+'-'+v('f_bride')+'.png';
  a.href=cv.toDataURL('image/png');a.click();
});
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('96px "Yatra One"'),document.fonts.load('34px "Kalam"')]).then(draw).catch(draw);
  setTimeout(draw,1200);
}else draw();
</script>
</body>
</html>
