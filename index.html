<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nukkad 3D — mohalla mein ghoomo</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Karla',sans-serif;background:#0d1226;color:var(--cream)}
  #c{display:block;width:100%;height:100%}
  /* UI overlay */
  #hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  #title{background:var(--enamel);border:3px solid var(--haldi);border-radius:6px;padding:6px 16px;transform:rotate(-1deg);
    box-shadow:4px 5px 0 rgba(0,0,0,.5)}
  #title h1{font-family:'Yatra One',cursive;font-size:clamp(18px,4vw,28px);text-shadow:2px 2px 0 var(--red);line-height:1}
  #title small{font-size:9px;letter-spacing:.2em;color:var(--haldi);font-weight:700}
  #liteLink{pointer-events:auto;background:#241c10;border:2px solid #5a4a28;border-radius:8px;padding:8px 12px;
    color:var(--cream);font-size:12px;font-weight:700;text-decoration:none}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(23,18,12,.85);
    border:2px solid #5a4a28;border-radius:20px;padding:8px 18px;font-size:12px;color:#c9b790;z-index:10;text-align:center;max-width:92vw}
  #tip{position:fixed;pointer-events:none;background:var(--haldi);color:var(--dark);font-weight:700;font-size:13px;
    padding:6px 12px;border-radius:8px;display:none;z-index:20;transform:translate(-50%,-140%);white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.4)}
  /* mobile move buttons */
  #mBtns{position:fixed;bottom:60px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:10}
  #mBtns button{width:56px;height:56px;border-radius:50%;border:3px solid var(--haldi);background:rgba(23,18,12,.8);
    color:var(--cream);font-size:22px;cursor:pointer}
  #mBtns button:active{background:var(--haldi);color:var(--dark)}
  @media(min-width:900px){#mBtns{display:none}}
  #fallback{display:none;padding:60px 20px;text-align:center;max-width:560px;margin:0 auto}
  #fallback a.big{display:inline-block;margin-top:16px;background:var(--red);color:var(--cream);font-weight:700;
    padding:14px 26px;border-radius:10px;text-decoration:none}
  #loader{position:fixed;inset:0;background:#0d1226;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .l1{font-family:'Yatra One',cursive;font-size:clamp(34px,8vw,60px);color:var(--haldi);text-shadow:3px 3px 0 var(--red)}
  #loader .l2{margin-top:8px;font-size:13px;color:#8a93b8}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="title"><h1>नुक्कड़ 3D</h1><small>WALK THE MOHALLA</small></div>
  <a id="liteLink" href="nukkad-classic.html">🗺️ list view</a>
</div>
<div id="hint">🖱️ drag = dekho · scroll / W,S = chalo · shop pe click = andar jao</div>
<div id="tip"></div>
<div id="mBtns"><button id="fwd" aria-label="Aage">▲</button><button id="bck" aria-label="Peeche">▼</button></div>

<div id="loader"><div class="l1">नुक्कड़</div><div class="l2">mohalla load ho raha hai... (mistri kaam pe hai)</div></div>

<div id="fallback">
  <h2 style="font-family:'Yatra One';font-size:32px;color:var(--haldi)">3D nahi chala 😅</h2>
  <p style="margin-top:10px;color:#c9b790">koi baat nahi — mohalla 2D mein bhi utna hi zinda hai.</p>
  <a class="big" href="nukkad-classic.html">🗺️ classic street kholo</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.getElementById('loader').style.display='none';
  document.getElementById('fallback').style.display='block';}
else (async function(){
/* ============ data: the 29 shops, in gali order ============ */
const GALIS=[
 {name:'🕰️ INTEZAAR GALI',shops:[
  ['Seeti','seeti.html','#12409e'],['Doodh','doodh.html','#d5342b'],['Line','line.html','#6b4423'],
  ['Sannata','sannata.html','#12409e'],['Sasta Net','sasta.html','#0e7c74']]},
 {name:'🕹️ AKHADA GALI',shops:[
  ['MolBhav','molbhav.html','#d5342b'],['Patang','patang.html','#0e7c74'],['Petrol','petrol.html','#12409e'],
  ['Chappal','chappal.html','#f2b31c'],['Bandar','bandar.html','#6b4423'],['Antenna','antenna.html','#0e7c74'],
  ['Papad','papad.html','#d5342b'],['Kabadi','kabadi.html','#6b4423']]},
 {name:'🖨️ CHHAPA KHANA',shops:[
  ['Buri Nazar','burinazar.html','#f2b31c'],['Slam Book','slambook.html','#e86a9e'],['Bahana','bahana.html','#12409e'],
  ['M. Times','mohallatimes.html','#d5342b'],['Shaadi Card','shaadicard.html','#7a1428'],['Jugaad','jugaad.html','#f2b31c']]},
 {name:'🔮 TOTKA GALI',shops:[
  ['Nazar Utaro','nazarutaro.html','#d5342b'],['Tota','tota.html','#1b7a3d'],['Ghanti','ghanti.html','#f2b31c']]},
 {name:'🛋️ BAITHAK GALI',shops:[
  ['Khidki','khidki.html','#0e7c74'],['Tapri','chai-tapri.html','#6b4423'],['Mummy','mummy.html','#e86a9e'],
  ['Bijli','bijli.html','#12409e'],['Chidiya','chidiya.html','#0e7c74'],['Mixtape','mixtape.html','#d5342b'],
  ['Padhai','padhai-kar-lo.html','#12409e']]},
 {name:'🆕 NAYA BAZAAR',shops:[
  ['Book Cricket','bookcricket.html','#12409e'],['Chidiya Ud','chidiyaud.html','#0e7c74'],['Raja Mantri','rajamantri.html','#7a1428'],
  ['Report Card','reportcard.html','#12409e'],['Shagun','shagun.html','#d5342b'],['Nuskhe','nuskhe.html','#f2b31c'],
  ['Loudspeaker','loudspeaker.html','#d5342b'],['Lift','lift.html','#12409e'],['Anar','anar.html','#d5342b'],
  ['Charcha','charcha.html','#6b4423'],['Timepass','timepass.html','#12409e']]}
];
/* ============ font first (sign textures need it) ============ */
try{await document.fonts.load('700 60px "Yatra One"');await document.fonts.load('700 30px "Karla"');}catch(e){}

/* ============ scene ============ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1226);
scene.fog=new THREE.Fog(0x0d1226,26,95);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,220);
let camZ=14,yaw=0,pitch=0;
camera.position.set(0,4.4,camZ);

/* lights */
scene.add(new THREE.AmbientLight(0x8890c0,.55));
const moon=new THREE.DirectionalLight(0xaabbee,.5);moon.position.set(-20,40,10);scene.add(moon);
const warm1=new THREE.PointLight(0xffb347,1.1,42);warm1.position.set(0,7,-8);scene.add(warm1);
const warm2=new THREE.PointLight(0xffb347,1.1,42);warm2.position.set(0,7,-58);scene.add(warm2);
const warm3=new THREE.PointLight(0xffb347,1.1,42);warm3.position.set(0,7,-108);scene.add(warm3);

/* helpers */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function signTex(text,bg,fg,sub){return canvasTex(512,192,x=>{
  x.fillStyle=bg;x.fillRect(0,0,512,192);
  x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=14;x.strokeRect(7,7,498,178);
  x.fillStyle=fg;x.font='700 76px "Yatra One"';x.textAlign='center';x.textBaseline='middle';
  if(x.measureText(text).width>460)x.font='700 58px "Yatra One"';
  x.fillText(text,256,86);
  if(sub){x.font='700 26px "Karla"';x.fillStyle='rgba(255,255,255,.75)';
    if(bg==='#f2b31c')x.fillStyle='rgba(60,40,0,.8)';
    x.fillText(sub,256,152);}});}
function awningTex(c1,c2){return canvasTex(256,64,x=>{
  for(let i=0;i<8;i++){x.fillStyle=i%2?c1:c2;x.fillRect(i*32,0,32,64);}});}

/* ============ ground + road ============ */
const totalLen=GALIS.reduce((a,g)=>a+g.shops.length,0)*0; /* computed below */
let z=-6; const shopMeshes=[];
const groundMat=new THREE.MeshLambertMaterial({color:0x2b2115});
const roadMat=new THREE.MeshLambertMaterial({color:0x241c10});
function ground(len,zc){
  const g1=new THREE.Mesh(new THREE.PlaneGeometry(80,len),groundMat);
  g1.rotation.x=-Math.PI/2;g1.position.set(0,0,zc);scene.add(g1);
  const r=new THREE.Mesh(new THREE.PlaneGeometry(10,len),roadMat);
  r.rotation.x=-Math.PI/2;r.position.set(0,.01,zc);scene.add(r);
  for(let zz=zc-len/2;zz<zc+len/2;zz+=4){
    const dash=new THREE.Mesh(new THREE.PlaneGeometry(.28,1.6),
      new THREE.MeshBasicMaterial({color:0x8a7750}));
    dash.rotation.x=-Math.PI/2;dash.position.set(0,.02,zz);scene.add(dash);}
}

/* ============ a shop building ============ */
function makeShop(name,file,color,x,zPos){
  const grp=new THREE.Group();
  const h=5+Math.random()*2.5;
  const body=new THREE.Mesh(new THREE.BoxGeometry(7,h,6),
    new THREE.MeshLambertMaterial({color:new THREE.Color(color).multiplyScalar(.75)}));
  body.position.y=h/2;grp.add(body);
  /* sign */
  const fg=(color==='#f2b31c')?'#17120c':'#f6ead3';
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(6.4,2.4),
    new THREE.MeshBasicMaterial({map:signTex(name,color,fg,'· click karo ·')}));
  sign.position.set(0,h-1.1,3.06);grp.add(sign);
  /* sign glow strip */
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(6.6,.18),
    new THREE.MeshBasicMaterial({color:0xffe9a0}));
  glow.position.set(0,h+.15,3.06);grp.add(glow);
  /* awning */
  const awn=new THREE.Mesh(new THREE.PlaneGeometry(6.8,1.6),
    new THREE.MeshBasicMaterial({map:awningTex('#f2b31c','#f6ead3'),side:THREE.DoubleSide}));
  awn.position.set(0,h-2.55,3.5);awn.rotation.x=-.5;grp.add(awn);
  /* door */
  const door=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.6,.2),
    new THREE.MeshLambertMaterial({color:0x3a2a14}));
  door.position.set(0,1.3,3.05);grp.add(door);
  /* warm doorway light */
  const dl=new THREE.Mesh(new THREE.PlaneGeometry(1.3,2.3),
    new THREE.MeshBasicMaterial({color:0xffdf9a}));
  dl.position.set(0,1.3,3.16);grp.add(dl);
  const side=x<0?1:-1;
  grp.position.set(x,0,zPos);
  grp.rotation.y=side*Math.PI/2*0; /* face street */
  if(x<0)grp.rotation.y=Math.PI*0; 
  /* rotate to face road */
  grp.rotation.y=(x<0)?Math.PI/2:-Math.PI/2;
  scene.add(grp);
  sign.userData={file,name};body.userData={file,name};door.userData={file,name};dl.userData={file,name};
  shopMeshes.push(sign,body,door,dl);
  grp.userData.sign=sign;
  return grp;
}
/* gali banner across the street */
function banner(text,zPos){
  const b=new THREE.Mesh(new THREE.PlaneGeometry(13,2),
    new THREE.MeshBasicMaterial({map:canvasTex(1024,160,x=>{
      x.fillStyle='#0e5c2e';x.fillRect(0,0,1024,160);
      x.strokeStyle='#fff';x.lineWidth=10;x.strokeRect(8,8,1008,144);
      x.fillStyle='#fff';x.font='700 78px "Yatra One"';x.textAlign='center';x.textBaseline='middle';
      x.fillText(text,512,84);}),side:THREE.DoubleSide,transparent:false}));
  b.position.set(0,8.2,zPos);scene.add(b);
  [-6.8,6.8].forEach(px=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,8.2,8),
    new THREE.MeshLambertMaterial({color:0x5a4a2e}));
    p.position.set(px,4.1,zPos);scene.add(p);});
}
/* lamp post */
function lamp(x,zPos){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,5.4,8),
    new THREE.MeshLambertMaterial({color:0x3a2f1c}));
  p.position.set(x,2.7,zPos);scene.add(p);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.32,10,10),
    new THREE.MeshBasicMaterial({color:0xffd28a}));
  bulb.position.set(x,5.5,zPos);scene.add(bulb);
  return bulb;
}

/* ============ build the street ============ */
const bulbs=[];
GALIS.forEach(gali=>{
  banner(gali.name,z-2);
  z-=6;
  gali.shops.forEach((s,i)=>{
    const side=i%2===0?-9.5:9.5;
    makeShop(s[0],s[1],s[2],side,z);
    if(i%3===0)bulbs.push(lamp(i%2?6:-6,z+3));
    z-=(i%2===1)?11:0;
  });
  if(gali.shops.length%2)z-=11;
  z-=5;
});
const streetEnd=z;
ground(Math.abs(streetEnd)+60,streetEnd/2+10);

/* gate at entry */
(function gate(){
  const mat=new THREE.MeshLambertMaterial({color:0x12409e});
  [-7.5,7.5].forEach(px=>{const p=new THREE.Mesh(new THREE.BoxGeometry(1.6,10,1.6),mat);
    p.position.set(px,5,8);scene.add(p);});
  const arch=new THREE.Mesh(new THREE.PlaneGeometry(17,3.4),
    new THREE.MeshBasicMaterial({map:canvasTex(1024,204,x=>{
      x.fillStyle='#12409e';x.fillRect(0,0,1024,204);
      x.strokeStyle='#f2b31c';x.lineWidth=16;x.strokeRect(10,10,1004,184);
      x.fillStyle='#f6ead3';x.font='700 120px "Yatra One"';x.textAlign='center';x.textBaseline='middle';
      x.shadowColor='#d5342b';x.shadowOffsetX=6;x.shadowOffsetY=6;
      x.fillText('नुक्कड़',512,104);}),side:THREE.DoubleSide}));
  arch.position.set(0,10.2,8);scene.add(arch);
})();
/* under-construction plot at the end */
(function site(){
  const s=new THREE.Mesh(new THREE.PlaneGeometry(11,2.6),
    new THREE.MeshBasicMaterial({map:canvasTex(1024,240,x=>{
      x.fillStyle='#241c10';x.fillRect(0,0,1024,240);
      x.strokeStyle='#f2b31c';x.lineWidth=10;x.setLineDash([30,18]);x.strokeRect(12,12,1000,216);
      x.fillStyle='#f2b31c';x.font='700 62px "Yatra One"';x.textAlign='center';
      x.fillText('🚧 60 aur dukaanein ban rahi hain 🚧',512,105);
      x.font='700 36px "Karla"';x.fillStyle='#c9b790';
      x.fillText('mistri chai peene gaya hai',512,180);}),side:THREE.DoubleSide}));
  s.position.set(0,3.4,streetEnd-6);scene.add(s);
})();

/* stars */
(function stars(){
  const geo=new THREE.BufferGeometry();const pos=[];
  for(let i=0;i<420;i++)pos.push((Math.random()-.5)*260,28+Math.random()*70,(Math.random()-.5)*320-40);
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.5})));
})();
/* moon */
const moonBall=new THREE.Mesh(new THREE.SphereGeometry(3.4,16,16),
  new THREE.MeshBasicMaterial({color:0xf2e8c8}));
moonBall.position.set(-34,44,-90);scene.add(moonBall);
/* wires + stuck kite */
(function wires(){
  const mat=new THREE.LineBasicMaterial({color:0x0a0810});
  for(let w=0;w<3;w++){
    const pts=[];
    for(let zz=12;zz>streetEnd-10;zz-=8)
      pts.push(new THREE.Vector3(-8+w*8+Math.sin(zz*.3)*1.5,9.4+w*.7+Math.sin(zz)*.4,zz));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
  }
  const kite=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.9),
    new THREE.MeshBasicMaterial({color:0xd5342b,side:THREE.DoubleSide}));
  kite.position.set(2,9.6,-30);kite.rotation.z=.5;scene.add(kite);
  window.__kite=kite;
})();
/* the dog: emoji sprite trotting the street */
const dog=(function(){
  const t=canvasTex(128,128,x=>{x.font='100px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🐕',64,70);});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));
  sp.scale.set(2.4,2.4,1);sp.position.set(2.5,1.1,-4);scene.add(sp);return sp;
})();

/* ============ controls ============ */
let dragging=false,px=0,py=0,moveV=0;
function onDown(e){dragging=true;px=e.clientX??e.touches[0].clientX;py=e.clientY??e.touches[0].clientY;}
function onMove(e){
  const cx=e.clientX??(e.touches&&e.touches[0].clientX),cy=e.clientY??(e.touches&&e.touches[0].clientY);
  if(dragging&&cx!=null){yaw-=(cx-px)*.004;pitch-=(cy-py)*.003;
    pitch=Math.max(-.5,Math.min(.4,pitch));px=cx;py=cy;}
  if(cx!=null)updateHover(cx,cy);
}
function onUp(){dragging=false;}
canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);
addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',e=>{onDown(e);},{passive:true});
canvas.addEventListener('touchmove',e=>{onMove(e);},{passive:true});
canvas.addEventListener('touchend',onUp);
addEventListener('wheel',e=>{moveV+=e.deltaY*.004;});
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let fwdHeld=false,bckHeld=false;
document.getElementById('fwd').addEventListener('pointerdown',()=>fwdHeld=true);
document.getElementById('fwd').addEventListener('pointerup',()=>fwdHeld=false);
document.getElementById('bck').addEventListener('pointerdown',()=>bckHeld=true);
document.getElementById('bck').addEventListener('pointerup',()=>bckHeld=false);

/* hover + click */
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
let hovered=null,downAt=null;
function updateHover(cx,cy){
  m2.x=(cx/innerWidth)*2-1;m2.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(m2,camera);
  const hits=ray.intersectObjects(shopMeshes);
  const tip=document.getElementById('tip');
  if(hits.length&&hits[0].distance<40){
    hovered=hits[0].object.userData;
    tip.style.display='block';tip.style.left=cx+'px';tip.style.top=cy+'px';
    tip.textContent='🚪 '+hovered.name+' — andar jao';
    canvas.style.cursor='pointer';
  }else{hovered=null;tip.style.display='none';canvas.style.cursor='grab';}
}
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if(!downAt)return;
  const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);
  if(moved<6&&hovered)location.href=hovered.file;
  downAt=null;
});

/* ============ animate ============ */
let t=0,dogZ=-4,dogDir=-1;
function animate(){
  requestAnimationFrame(animate);
  t+=.016;
  if(keys['w']||keys['arrowup']||fwdHeld)moveV-=.06;
  if(keys['s']||keys['arrowdown']||bckHeld)moveV+=.06;
  camZ+=moveV;moveV*=.88;
  camZ=Math.max(streetEnd-2,Math.min(16,camZ));
  camera.position.set(Math.sin(yaw)*0,4.4+Math.sin(t*1.2)*.05,camZ);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;camera.rotation.x=pitch;
  /* lamp flicker */
  if(Math.random()<.015)warm2.intensity=.4+Math.random()*.8;else warm2.intensity+= (1.1-warm2.intensity)*.1;
  bulbs.forEach(b=>b.material.color.setHSL(.1,.9,.7+Math.sin(t*3+b.position.z)*.05));
  /* kite sway */
  if(window.__kite){window.__kite.rotation.z=.5+Math.sin(t*1.6)*.15;}
  /* dog trots the street, follows-ish */
  dogZ+=dogDir*.045;
  if(dogZ<streetEnd+6)dogDir=1;if(dogZ>10)dogDir=-1;
  /* dog drifts toward camera sometimes — mohalle ka kutta */
  if(Math.abs(dogZ-camZ)<14)dogZ+=(camZ-4-dogZ)*.002;
  dog.position.set(2.5+Math.sin(t*.7)*1.5,1.1+Math.abs(Math.sin(t*7))*.14,dogZ);
  renderer.render(scene,camera);
}
function resize(){renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
animate();
setTimeout(()=>document.getElementById('loader').classList.add('hide'),900);
})().catch(e=>{document.getElementById('loader').style.display='none';
  document.getElementById('fallback').style.display='block';console.error(e);});
</script>
</body>
</html>
