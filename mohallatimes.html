<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohalla Times — sabse tez, sabse jhooti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--enamel:#12409e;--red:#d5342b;--haldi:#f2b31c;--cream:#f6ead3;--dark:#17120c}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Karla',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;
    background-image:radial-gradient(circle at 50% -10%, #2a2115 0%, var(--dark) 60%);
    display:flex;flex-direction:column;align-items:center;padding:26px 14px 60px}
  a.back{align-self:flex-start;color:var(--haldi);font-size:13px;text-decoration:none;margin-bottom:8px}
  .brand{background:var(--enamel);border:4px solid var(--haldi);border-radius:6px;padding:8px 26px;
    transform:rotate(-1deg);box-shadow:5px 6px 0 rgba(0,0,0,.5);margin-bottom:4px}
  .brand h1{font-family:'Yatra One',cursive;font-size:clamp(26px,5vw,40px);text-shadow:2px 2px 0 var(--red)}
  .sub{color:#c9b790;font-size:12px;margin-bottom:20px;text-align:center}
  #panel{width:min(620px,96vw);display:flex;flex-direction:column;gap:12px}
  canvas{width:100%;border-radius:6px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input,select{flex:1;min-width:170px;font-family:'Karla';font-size:15px;font-weight:700;padding:11px 13px;border-radius:8px;
    border:2px solid #3a2f1c;background:#241c10;color:var(--cream);outline:none}
  input:focus,select:focus{border-color:var(--haldi)}
  button{font-family:'Karla';font-weight:700;font-size:15px;border:none;border-radius:10px;padding:13px 20px;cursor:pointer}
  button:hover{transform:translateY(-2px)}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
  #genBtn{background:var(--enamel);color:var(--cream)}
  #dlBtn{background:var(--red);color:var(--cream);flex:1}
  .note{font-size:11px;color:#8a7750;text-align:center}
</style>
</head>
<body>
<a class="back" href="index.html">← nukkad</a>
<div class="brand"><h1>मोहल्ला टाइम्स</h1></div>
<p class="sub">MOHALLA TIMES · sabse tez · sabse jhooti · source: watchman bhaiya</p>

<div id="panel">
  <canvas id="cv" width="1000" height="1300"></canvas>
  <div class="row">
    <input id="f_name" maxlength="14" value="Bunty" aria-label="Victim's name" placeholder="kiska naam chhapna hai?">
    <select id="f_story" aria-label="Scandal type">
      <option value="0">🚿 nahaya nahi scandal</option>
      <option value="1">📱 phone addiction exposé</option>
      <option value="2">😴 neend breaking news</option>
      <option value="3">🍽️ khana chori kaand</option>
      <option value="4">💔 crush ka bhandafod</option>
      <option value="5">📚 padhai ka natak</option>
    </select>
  </div>
  <div class="row">
    <button id="genBtn">🎲 headlines badlo</button>
    <button id="dlBtn">⬇️ PNG DOWNLOAD — victim ko tag karo</button>
  </div>
  <p class="note">disclaimer: Mohalla Times ki har khabar 100% jhooti hai. bilkul asli mohalle ki tarah.</p>
</div>

<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const STORIES=[
  {h1:n=>`${n} NE 3 DIN SE NAHAYA NAHI`,sub:n=>`padosiyon ne kholi khidkiyan band ki; ${n} ka bayan: "thand hai"`,
   body:[`Mohalle mein hadkamp mach gaya jab vishwasniya sootron (balcony wali aunty) ne pushti ki ki ${'{n}'} ji pichhle teen din se sirf "haath-mooh dho ke" kaam chala rahe hain.`,
   `Watchman bhaiya ne bataya: "hawa ka rukh badal gaya hai gali mein."`,`Parivaar ne is khabar ko "andruni maamla" bataya hai.`]},
  {h1:n=>`${n} KA SCREEN TIME: 14 GHANTE`,sub:n=>`phone ne maanga chhutti ka aavedan; charger ne di isteefe ki dhamki`,
   body:[`Ek chaunkane wale khulase mein pata chala hai ki ${'{n}'} ji ka phone unse zyada thak chuka hai.`,
   `Ghar walon ka kehna hai ki khaane ki table par bhi "bas 2 minute" sunayi deta hai. Woh 2 minute 2011 se chal rahe hain.`,`Phone ki battery ne naam na chhapne ki shart par kaha: "main akeli sab nahi sambhal sakti."`]},
  {h1:n=>`DOPAHER 2 BAJE TAK SOYA ${n.toUpperCase()}`,sub:n=>`suraj ne kiya intezaar, phir chala gaya; alarm ki maut ki jaanch jaari`,
   body:[`Aaj subah — yaani dopahar — ${'{n}'} ji ke kamre se uthne ki koi awaaz nahi aayi.`,
   `Mummy ji ne 4 baar darwaza khatkhataya. Panchhi ud gaye, doodhwala aa ke chala gaya, par neend adig rahi.`,`Visheshagyon ka manna hai ki yeh kshamta Olympic mein honi chahiye.`]},
  {h1:n=>`FRIDGE SE GAYAB HUI MITHAI, ${n.toUpperCase()} PE SHAK`,sub:n=>`gawah: sirf ek chammach; saboot: mooh pe lagi rabdi`,
   body:[`Kal raat fridge mein rakhi rasmalai subah gaayab mili. Poore ghar mein sirf ek vyakti ne "mujhe toh pata bhi nahi tha rasmalai hai" kaha — bina poochhe.`,
   `${'{n}'} ji ne khud ko nirdosh bataya, par unke takiye ke neeche se chammach baramad hui hai.`,`Adalat (dadi ji) ka faisla: agli baar sabke liye laana.`]},
  {h1:n=>`${n} KA CRUSH SABKO PATA CHAL GAYA`,sub:n=>`group chat mein galat message; mohalle mein mithai batne ki maang`,
   body:[`Ek historic typo ne kal raat sab kuch badal diya. ${'{n}'} ji ne jo message "personal" mein bhejna tha, woh family group mein chala gaya.`,
   `Mausi ji ne turant "kaun hai yeh??" ke saath 3 missed call kiye. Chachaji ne shaadi ka pandal book karne ki baat ki.`,`${'{n}'} ji phone band karke chhat pe baithe hain. Humari sanvedanayein unke saath hain.`]},
  {h1:n=>`${n} NE KHOLI KITAB, MOHALLE MEIN JASHN`,sub:n=>`3 mahine baad hua chamatkar; kitab ne kaha "mujhe laga bhool gaye"`,
   body:[`Itihaas ban gaya kal shaam jab ${'{n}'} ji ne apni kitab kholi. Kitab ke andar se pichhle saal ka samosa ka bill nikla.`,
   `Padhai 11 minute chali, jiske baad "5 minute ka break" liya gaya. Break abhi bhi jaari hai.`,`Phir bhi mohalla umeed se bhara hai. Sharma ji chinta mein hain.`]}
];
const SIDE=[
  ['PANI KAL AAYEGA','(source: watchman. bharosa aapki marzi.)'],
  ['GALI KA KUTTA "SHERU" AB "BRUNO"','naam badla, attitude wahi'],
  ['AAJ SHAAM LIGHT JAYEGI','inverter walon ne banayi doori'],
  ['SABZI WALE KA RATE PHIR BADHA','tamatar ab statement piece hai'],
  ['CRICKET BALL PHIR SHARMA JI KE GHAR','window score: 3-0']
];
function wrap(txt,mx,lh,startY,font,color,align='left',xPos=60){
  x.font=font;x.fillStyle=color;x.textAlign=align;
  const words=txt.split(' ');let line='',y=startY;
  for(const w of words){
    if(x.measureText(line+w).width>mx){x.fillText(line,xPos,y);line=w+' ';y+=lh;}
    else line+=w+' ';
  }
  x.fillText(line,xPos,y);return y+lh;
}
function draw(){
  const n=(document.getElementById('f_name').value||'Bunty').trim();
  const st=STORIES[+document.getElementById('f_story').value];
  const now=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  x.fillStyle='#f4eeda';x.fillRect(0,0,1000,1300);
  /* masthead */
  x.textAlign='center';
  x.font='92px "Yatra One"';x.fillStyle='#17120c';
  x.fillText('मोहल्ला टाइम्स',500,110);
  x.font='bold 18px Karla';x.fillStyle='#6b5b3a';
  x.fillText('SABSE TEZ · SABSE JHOOTI · GHAR GHAR KI AWAAZ',500,148);
  x.fillText(now.toUpperCase()+'  ·  MULYA: ₹2 (udhaar chalega)  ·  ANK 1,847',500,176);
  x.fillStyle='#17120c';x.fillRect(40,196,920,6);x.fillRect(40,208,920,2);
  /* main headline */
  x.font='64px "Yatra One"';x.fillStyle='#c8302f';
  const h=st.h1(n);
  if(x.measureText(h).width>900)x.font='50px "Yatra One"';
  x.fillText(h,500,290);
  x.font='italic bold 24px Karla';x.fillStyle='#17120c';
  x.fillText(st.sub(n),500,336);
  /* "photo" */
  x.fillStyle='#d8cfae';x.fillRect(60,370,540,330);
  x.strokeStyle='#17120c';x.lineWidth=3;x.strokeRect(60,370,540,330);
  x.font='120px Karla';x.fillText('🫣',330,560);
  x.font='italic 17px Karla';x.fillStyle='#555';
  x.fillText('(tasveer: ghatna sthal se, camera hilta hua)',330,676);
  /* body columns */
  x.textAlign='left';
  let y=400;
  st.body.forEach(p=>{y=wrap(p.replaceAll('{n}',n),320,26,y,'19px Karla','#222','left',630)+8;});
  /* divider */
  x.fillStyle='#17120c';x.fillRect(40,730,920,3);
  /* side headlines row */
  x.textAlign='left';
  let sy=780;
  const picks=[...SIDE].sort(()=>Math.random()-.5).slice(0,4);
  picks.forEach((s,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const sx=60+col*470,yy=sy+row*220;
    x.font='30px "Yatra One"';x.fillStyle='#12409e';
    x.fillText(s[0],sx,yy);
    x.font='italic 18px Karla';x.fillStyle='#444';
    x.fillText(s[1],sx,yy+32);
    x.strokeStyle='#b8ad88';x.lineWidth=1;
    x.beginPath();x.moveTo(sx,yy+60);x.lineTo(sx+420,yy+60);x.stroke();
  });
  /* footer */
  x.fillStyle='#17120c';x.fillRect(40,1230,920,2);
  x.font='15px Karla';x.fillStyle='#6b5b3a';x.textAlign='center';
  x.fillText('sampadak: balcony wali aunty · sanvaad-daata: watchman bhaiya · vitaran: cycle wala chhotu · nukkad press',500,1264);
}
document.getElementById('f_name').addEventListener('input',draw);
document.getElementById('f_story').addEventListener('change',draw);
document.getElementById('genBtn').addEventListener('click',draw);
document.getElementById('dlBtn').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='mohalla-times-'+(document.getElementById('f_name').value||'breaking')+'.png';
  a.href=cv.toDataURL('image/png');a.click();
});
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('92px "Yatra One"'),document.fonts.load('19px Karla')]).then(draw).catch(draw);
  setTimeout(draw,1200);
}else draw();
</script>
</body>
</html>
